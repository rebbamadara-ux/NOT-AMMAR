
name: Extract REBBA Server ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP safely
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          archives = list(Path(".").glob("*.zip"))
          if len(archives) != 1:
              raise SystemExit("Expected exactly one ZIP file")

          archive = archives[0]
          destination = Path("server").resolve()

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  target = (destination / item.filename).resolve()
                  if target != destination and destination not in target.parents:
                      raise SystemExit("Unsafe ZIP path detected")
              z.extractall(destination)

          print("Extraction completed:", archive.name)
          PY

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/
          git commit -m "Extract REBBA server files" || echo "No changes"
          git push
          
